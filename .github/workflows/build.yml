name: PlatformIO Build All

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: "${{ matrix.group }}"
    # The ESP32-C2 is the only board PlatformIO builds through ESP-IDF, and that
    # builder does not work with SCons 4.9 or newer. The failure is upstream, not
    # in this repository, so it is reported without failing everything else.
    continue-on-error: ${{ matrix.group == 'ModernESP_C2' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false   # let every board group report its own result
      matrix:
        include:
          - group: ModernESP_C2
            boards: "esp32c2"
            # Never cache .pio here: the ESP-IDF build of the C2 stores SCons
            # signatures that a later SCons version cannot read back, which fails
            # the link step with "No module named 'SCons.Tool.FortranCommon'".
            cache_extra: ""
          - group: ModernESP_C3_C5_C6
            boards: "esp32c3 esp32c5 esp32c6"
            cache_extra: ""
          - group: ModernESP_S2
            boards: "esp32s2"
            cache_extra: ""
          - group: ModernESP_S3
            boards: "esp32s3"
            cache_extra: ""
          - group: ClassicESP
            boards: "esp32 esp32-eth01 esp8266"
            cache_extra: ""
          - group: CustomBoards
            boards: "esp32-GLEDOPTO_GL_C_616WL esp32-GLEDOPTO_GL_C_615WL esp32-DOMRAEM_WLE_ADM esp32-IOTORERO_ETHERNET"
            cache_extra: "" 
          - group: Pico
            boards: "pico pico2"
            cache_extra: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: "Cache PlatformIO - ${{ matrix.group }}"
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            .ccache
            ${{ matrix.cache_extra }}
          key: pio2-${{ matrix.group }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio2-${{ matrix.group }}-

      - name: Install PlatformIO + esptool + ccache
        run: |
          sudo apt update
          sudo apt install ccache
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Try an older SCons for the ESP-IDF builder
        if: matrix.group == 'ModernESP_C2'
        continue-on-error: true
        run: pio pkg install -g -t "platformio/tool-scons@~4.40800.0"

      - name: Build ${{ matrix.group }}
        run: |
          ENVS="${{ matrix.boards }}"
          CMD="pio run -j 2"
          for env in $ENVS; do
            CMD="$CMD -e $env"
          done
          eval "$CMD"

      - name: "Upload Artifacts - ${{ matrix.group }}"
        uses: actions/upload-artifact@v7
        with:
          name: Hyperk-Firmware-${{ matrix.group }}
          path: release/
          if-no-files-found: error

      - name: Generate Job Summary
        run: |
          echo "**Boards:** ${{ matrix.boards }}" >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Hyperk-Firmware-*
          path: release
          merge-multiple: true

      - name: Create Pre-release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}